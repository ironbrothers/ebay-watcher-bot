name: Run Bot Daily

on:
  schedule:
    - cron: '0 12 * * *'  # Runs daily at 8 AM ET
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install packages
        run: pip install requests beautifulsoup4
      - name: Run the bot
        run: python most_watched_bot.py
